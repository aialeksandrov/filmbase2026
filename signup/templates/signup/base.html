{% load static %}
{% load django_bootstrap5 %}
<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Каталог фильмов</title>
    {% bootstrap_css %}
    {% bootstrap_javascript %}
    <link rel="stylesheet" href="{% static 'css/main.css' %}" />
  </head>

  <body>
    {% bootstrap_messages %}
    <div class="d-lg-flex vh-100 wh-100 position-relative">
      <div
        class="flex-fill bg-body-secondary d-flex justify-content-center align-items-center p-4"
      >
        <h1>Каталог фильмов</h1>
      </div>
      <div
        class="flex-fill d-flex justify-content-center align-items-center p-4"
      >
        <div class="w-75 p-4">
          {% block content %}
          {% endblock %}
        </div>
      </div>
    </div>
  </body>
</html>

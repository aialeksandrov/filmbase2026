{% load static %}
{% load django_bootstrap5 %}
<!DOCTYPE html>
<html lang="ru">

<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Каталог фильмов</title>
  {% bootstrap_css %}
  {% bootstrap_javascript %}
  <link rel="stylesheet" href="{% static 'css/main.css' %}" />
</head>

<body>
  {% include "navbar.html" %}

  <div class="container">
    {% block breadcrumb %}

    {% bootstrap_messages %}

</html>
